appId: ${APP_ID}
name: EnlaceSeguro — límite diario de cinco análisis
tags:
  - e2e
  - quota
---
- launchApp:
    clearState: true
    clearKeychain: true
- assertVisible: Omitir
- tapOn: Omitir

- assertVisible: Inicia sesión
- tapOn: Crear cuenta
- assertVisible: Crea tu cuenta
- tapOn: Correo electrónico
- inputText: ${QUOTA_TEST_EMAIL}
- tapOn: Contraseña
- inputText: ${TEST_PASSWORD}
- hideKeyboard
- tapOn: Crear cuenta

- assertVisible: Tu cuenta quedó creada. Inicia sesión para continuar.
- tapOn: Correo electrónico
- inputText: ${QUOTA_TEST_EMAIL}
- tapOn: Contraseña
- inputText: ${TEST_PASSWORD}
- hideKeyboard
- tapOn: Iniciar sesión
- assertVisible: ANALIZA UN ENLACE

# Analyses 1–5 are admitted and completed using the disposable synthetic Sandbox.
- tapOn: Enlace o mensaje para analizar
- inputText: https://example.test/quota-attempt-1
- hideKeyboard
- scrollUntilVisible:
    element: Analizar enlace
    direction: DOWN
- tapOn: Analizar enlace
- extendedWaitUntil:
    visible: Sospechoso
    timeout: 45000
- scrollUntilVisible:
    element: Analizar otro enlace
    direction: DOWN
- tapOn: Analizar otro enlace

