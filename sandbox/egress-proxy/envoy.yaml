static_resources:
  listeners:
    - name: sandbox_egress_http_proxy
      address:
        socket_address:
          # Bind only inside the container network. Do not publish this port publicly.
          address: 0.0.0.0
          port_value: 10000
      per_connection_buffer_limit_bytes: 65536
      filter_chains:
        - filters:
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                stat_prefix: sandbox_egress
                codec_type: HTTP1
                common_http_protocol_options:
                  idle_timeout: 5s
                  max_headers_count: 100
                stream_idle_timeout: 25s
                # This mapper is applied only to replies generated locally by Envoy.
                # Do not use a response-header default here: website 4xx/5xx must not
                # be interpreted as proxy/security failures by the API.
                local_reply_config:
                  mappers:
                    - filter:
                        status_code_filter:
                          comparison:
                            op: GE
                            value:
                              default_value: 100
                      headers_to_add:
                        - header:
                            key: x-enlaceseguro-egress-error
                            value: "true"
                          append_action: OVERWRITE_IF_EXISTS_OR_ADD
                http_protocol_options:
                  allow_absolute_url: true
                route_config:
                  name: sandbox_egress_routes
                  virtual_hosts:
                    - name: all_destinations
                      domains:
                        - "*"
                      # Reserve this response header for Envoy-generated local replies.
                      # Prevent untrusted website responses from forging the marker.
                      response_headers_to_remove:
                        - x-enlaceseguro-egress-error
                      routes:
                        # HTTPS is passed through as raw TCP. Envoy does not terminate
                        # TLS or inspect the tunneled HTTP requests.
                        - match:
                            connect_matcher: {}
                            headers:
                              - name: ":authority"
                                safe_regex_match:
                                  google_re2: {}
                                  regex: "^(?:[A-Za-z0-9.-]+|\\[[0-9A-Fa-f:.]+\\]):443$"
                          route:
                            cluster: dynamic_forward_proxy
                            timeout: 25s
                            upgrade_configs:
                              - upgrade_type: CONNECT
                                connect_config: {}
                        # Explicit CONNECT catch-all; Envoy otherwise returns its
                        # default 404 for unmatched CONNECT authorities.
                        - match:
                            connect_matcher: {}
                          direct_response:
                            status: 403
                            body:
                              inline_string: "egress destination denied\n"
                        # Plain HTTP only. An explicit authority port is limited to 80.
                        - match:
                            prefix: "/"
                            headers:
                              - name: ":scheme"
                                exact_match: "http"
                              - name: ":authority"
                                safe_regex_match:
                                  google_re2: {}
                                  regex: "^(?:[A-Za-z0-9.-]+|\\[[0-9A-Fa-f:.]+\\])(?::80)?$"
                          route:
                            cluster: dynamic_forward_proxy
                            timeout: 25s
                        # Deny unsupported schemes, ports, malformed authorities and
                        # every other method/route. No catch-all forwarding fallback.
                        - match:
                            prefix: "/"
                          direct_response:
                            status: 403
                            body:
                              inline_string: "egress destination denied\n"
                http_filters:
                  - name: envoy.filters.http.dynamic_forward_proxy
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.dynamic_forward_proxy.v3.FilterConfig
                      dns_cache_config:
                        name: sandbox_egress_dns_cache
                        dns_lookup_family: ALL
                        dns_query_timeout: 2s
                        dns_min_refresh_rate: 1s
                        host_ttl: 60s
                        max_hosts: 2048
                        resolved_address_filter:
                          ranges:
                            - address_prefix: 0.0.0.0
                              prefix_len: 8
                            - address_prefix: 10.0.0.0
                              prefix_len: 8
                            - address_prefix: 100.64.0.0
                              prefix_len: 10
                            - address_prefix: 127.0.0.0
                              prefix_len: 8
                            - address_prefix: 169.254.0.0
                              prefix_len: 16
                            - address_prefix: 172.16.0.0
                              prefix_len: 12
                            - address_prefix: 192.0.0.0
                              prefix_len: 24
                            - address_prefix: 192.0.2.0
                              prefix_len: 24
                            - address_prefix: 192.88.99.0
                              prefix_len: 24
                            - address_prefix: 192.168.0.0
                              prefix_len: 16
                            - address_prefix: 198.18.0.0
                              prefix_len: 15
                            - address_prefix: 198.51.100.0
                              prefix_len: 24
                            - address_prefix: 203.0.113.0
                              prefix_len: 24
                            - address_prefix: 224.0.0.0
                              prefix_len: 4
                            - address_prefix: 240.0.0.0
                              prefix_len: 4
                            # Deprecated IPv4-compatible IPv6 forms, including
                            # ::a.b.c.d encodings of private IPv4 destinations.
                            - address_prefix: "::"
                              prefix_len: 96
                            - address_prefix: "::1"
                              prefix_len: 128
                            - address_prefix: "::ffff:0:0"
                              prefix_len: 96
                            - address_prefix: "64:ff9b::"
                              prefix_len: 96
                            - address_prefix: "64:ff9b:1::"
                              prefix_len: 48
                            - address_prefix: "100::"
                              prefix_len: 64
                            - address_prefix: "2001::"
                              prefix_len: 23
                            - address_prefix: "2001:db8::"
                              prefix_len: 32
                            - address_prefix: "2002::"
                              prefix_len: 16
                            - address_prefix: "fc00::"
                              prefix_len: 7
                            - address_prefix: "fe80::"
                              prefix_len: 10
                            - address_prefix: "fec0::"
                              prefix_len: 10
                            - address_prefix: "ff00::"
                              prefix_len: 8
                  - name: envoy.filters.http.router
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
                      upstream_http_filters:
                        - name: envoy.filters.http.upstream_rbac
                          typed_config:
                            "@type": type.googleapis.com/envoy.extensions.filters.http.rbac.v3.RBAC
                            rules:
                              action: DENY
                              policies:
                                deny_non_public_resolved_addresses:
                                  permissions:
                                    - matcher:
                                        name: envoy.rbac.matchers.upstream_ip_port
                                        typed_config:
                                          "@type": type.googleapis.com/envoy.extensions.rbac.matchers.upstream_ip_port.v3.UpstreamIpPortMatcher
                                          upstream_ip:
                                            address_prefix: "::"
                                            prefix_len: 96
                                    - matcher:
                                        name: envoy.rbac.matchers.upstream_ip_port
                                        typed_config:
                                          "@type": type.googleapis.com/envoy.extensions.rbac.matchers.upstream_ip_port.v3.UpstreamIpPortMatcher
                                          upstream_ip:
                                            address_prefix: 0.0.0.0
                                            prefix_len: 8
                                    - matcher:
                                        name: envoy.rbac.matchers.upstream_ip_port
                                        typed_config:
                                          "@type": type.googleapis.com/envoy.extensions.rbac.matchers.upstream_ip_port.v3.UpstreamIpPortMatcher
                                          upstream_ip:
                                            address_prefix: 10.0.0.0
                                            prefix_len: 8
                                    - matcher:
                                        name: envoy.rbac.matchers.upstream_ip_port
                                        typed_config:
                                          "@type": type.googleapis.com/envoy.extensions.rbac.matchers.upstream_ip_port.v3.UpstreamIpPortMatcher
                                          upstream_ip:
                                            address_prefix: 100.64.0.0
                                            prefix_len: 10
                                    - matcher:
                                        name: envoy.rbac.matchers.upstream_ip_port
                                        typed_config:
                                          "@type": type.googleapis.com/envoy.extensions.rbac.matchers.upstream_ip_port.v3.UpstreamIpPortMatcher
                                          upstream_ip:
                                            address_prefix: 127.0.0.0
                                            prefix_len: 8
                                    - matcher:
                                        name: envoy.rbac.matchers.upstream_ip_port
                                        typed_config:
                                          "@type": type.googleapis.com/envoy.extensions.rbac.matchers.upstream_ip_port.v3.UpstreamIpPortMatcher
                                          upstream_ip:
                                            address_prefix: 169.254.0.0
                                            prefix_len: 16
                                    - matcher:
                                        name: envoy.rbac.matchers.upstream_ip_port
                                        typed_config:
                                          "@type": type.googleapis.com/envoy.extensions.rbac.matchers.upstream_ip_port.v3.UpstreamIpPortMatcher
                                          upstream_ip:
                                            address_prefix: 172.16.0.0
                                            prefix_len: 12
                                    - matcher:
                                        name: envoy.rbac.matchers.upstream_ip_port
                                        typed_config:
                                          "@type": type.googleapis.com/envoy.extensions.rbac.matchers.upstream_ip_port.v3.UpstreamIpPortMatcher
                                          upstream_ip:
                                            address_prefix: 192.0.0.0
                                            prefix_len: 24
                                    - matcher:
                                        name: envoy.rbac.matchers.upstream_ip_port
                                        typed_config:
                                          "@type": type.googleapis.com/envoy.extensions.rbac.matchers.upstream_ip_port.v3.UpstreamIpPortMatcher
                                          upstream_ip:
                                            address_prefix: 192.0.2.0
                                            prefix_len: 24
                                    - matcher:
                                        name: envoy.rbac.matchers.upstream_ip_port
                                        typed_config:
                                          "@type": type.googleapis.com/envoy.extensions.rbac.matchers.upstream_ip_port.v3.UpstreamIpPortMatcher
                                          upstream_ip:
                                            address_prefix: 192.88.99.0
                                            prefix_len: 24
                                    - matcher:
                                        name: envoy.rbac.matchers.upstream_ip_port
                                        typed_config:
                                          "@type": type.googleapis.com/envoy.extensions.rbac.matchers.upstream_ip_port.v3.UpstreamIpPortMatcher
                                          upstream_ip:
                                            address_prefix: 192.168.0.0
                                            prefix_len: 16
                                    - matcher:
                                        name: envoy.rbac.matchers.upstream_ip_port
                                        typed_config:
                                          "@type": type.googleapis.com/envoy.extensions.rbac.matchers.upstream_ip_port.v3.UpstreamIpPortMatcher
                                          upstream_ip:
                                            address_prefix: 198.18.0.0
                                            prefix_len: 15
                                    - matcher:
                                        name: envoy.rbac.matchers.upstream_ip_port
                                        typed_config:
                                          "@type": type.googleapis.com/envoy.extensions.rbac.matchers.upstream_ip_port.v3.UpstreamIpPortMatcher
                                          upstream_ip:
                                            address_prefix: 198.51.100.0
                                            prefix_len: 24
                                    - matcher:
                                        name: envoy.rbac.matchers.upstream_ip_port
                                        typed_config:
                                          "@type": type.googleapis.com/envoy.extensions.rbac.matchers.upstream_ip_port.v3.UpstreamIpPortMatcher
                                          upstream_ip:
                                            address_prefix: 203.0.113.0
                                            prefix_len: 24
                                    - matcher:
                                        name: envoy.rbac.matchers.upstream_ip_port
                                        typed_config:
                                          "@type": type.googleapis.com/envoy.extensions.rbac.matchers.upstream_ip_port.v3.UpstreamIpPortMatcher
                                          upstream_ip:
                                            address_prefix: 224.0.0.0
                                            prefix_len: 4
                                    - matcher:
                                        name: envoy.rbac.matchers.upstream_ip_port
                                        typed_config:
                                          "@type": type.googleapis.com/envoy.extensions.rbac.matchers.upstream_ip_port.v3.UpstreamIpPortMatcher
                                          upstream_ip:
                                            address_prefix: 240.0.0.0
                                            prefix_len: 4
                                    - matcher:
                                        name: envoy.rbac.matchers.upstream_ip_port
                                        typed_config:
                                          "@type": type.googleapis.com/envoy.extensions.rbac.matchers.upstream_ip_port.v3.UpstreamIpPortMatcher
                                          upstream_ip:
                                            address_prefix: "::"
                                            prefix_len: 128
                                    - matcher:
                                        name: envoy.rbac.matchers.upstream_ip_port
                                        typed_config:
                                          "@type": type.googleapis.com/envoy.extensions.rbac.matchers.upstream_ip_port.v3.UpstreamIpPortMatcher
                                          upstream_ip:
                                            address_prefix: "::1"
                                            prefix_len: 128
                                    - matcher:
                                        name: envoy.rbac.matchers.upstream_ip_port
                                        typed_config:
                                          "@type": type.googleapis.com/envoy.extensions.rbac.matchers.upstream_ip_port.v3.UpstreamIpPortMatcher
                                          upstream_ip:
                                            address_prefix: "::ffff:0:0"
                                            prefix_len: 96
                                    - matcher:
                                        name: envoy.rbac.matchers.upstream_ip_port
                                        typed_config:
                                          "@type": type.googleapis.com/envoy.extensions.rbac.matchers.upstream_ip_port.v3.UpstreamIpPortMatcher
                                          upstream_ip:
                                            address_prefix: "64:ff9b::"
                                            prefix_len: 96
                                    - matcher:
                                        name: envoy.rbac.matchers.upstream_ip_port
                                        typed_config:
                                          "@type": type.googleapis.com/envoy.extensions.rbac.matchers.upstream_ip_port.v3.UpstreamIpPortMatcher
                                          upstream_ip:
                                            address_prefix: "64:ff9b:1::"
                                            prefix_len: 48
                                    - matcher:
                                        name: envoy.rbac.matchers.upstream_ip_port
                                        typed_config:
                                          "@type": type.googleapis.com/envoy.extensions.rbac.matchers.upstream_ip_port.v3.UpstreamIpPortMatcher
                                          upstream_ip:
                                            address_prefix: "100::"
                                            prefix_len: 64
                                    - matcher:
                                        name: envoy.rbac.matchers.upstream_ip_port
                                        typed_config:
                                          "@type": type.googleapis.com/envoy.extensions.rbac.matchers.upstream_ip_port.v3.UpstreamIpPortMatcher
                                          upstream_ip:
                                            address_prefix: "2001::"
                                            prefix_len: 23
                                    - matcher:
                                        name: envoy.rbac.matchers.upstream_ip_port
                                        typed_config:
                                          "@type": type.googleapis.com/envoy.extensions.rbac.matchers.upstream_ip_port.v3.UpstreamIpPortMatcher
                                          upstream_ip:
                                            address_prefix: "2001:db8::"
                                            prefix_len: 32
                                    - matcher:
                                        name: envoy.rbac.matchers.upstream_ip_port
                                        typed_config:
                                          "@type": type.googleapis.com/envoy.extensions.rbac.matchers.upstream_ip_port.v3.UpstreamIpPortMatcher
                                          upstream_ip:
                                            address_prefix: "2002::"
                                            prefix_len: 16
                                    - matcher:
                                        name: envoy.rbac.matchers.upstream_ip_port
                                        typed_config:
                                          "@type": type.googleapis.com/envoy.extensions.rbac.matchers.upstream_ip_port.v3.UpstreamIpPortMatcher
                                          upstream_ip:
                                            address_prefix: "fc00::"
                                            prefix_len: 7
                                    - matcher:
                                        name: envoy.rbac.matchers.upstream_ip_port
                                        typed_config:
                                          "@type": type.googleapis.com/envoy.extensions.rbac.matchers.upstream_ip_port.v3.UpstreamIpPortMatcher
                                          upstream_ip:
                                            address_prefix: "fe80::"
                                            prefix_len: 10
                                    - matcher:
                                        name: envoy.rbac.matchers.upstream_ip_port
                                        typed_config:
                                          "@type": type.googleapis.com/envoy.extensions.rbac.matchers.upstream_ip_port.v3.UpstreamIpPortMatcher
                                          upstream_ip:
                                            address_prefix: "fec0::"
                                            prefix_len: 10
                                    - matcher:
                                        name: envoy.rbac.matchers.upstream_ip_port
                                        typed_config:
                                          "@type": type.googleapis.com/envoy.extensions.rbac.matchers.upstream_ip_port.v3.UpstreamIpPortMatcher
                                          upstream_ip:
                                            address_prefix: "ff00::"
                                            prefix_len: 8
                                  principals:
                                    - any: true
                        - name: envoy.filters.http.upstream_codec
                          typed_config:
                            "@type": type.googleapis.com/envoy.extensions.filters.http.upstream_codec.v3.UpstreamCodec
      # Admin stays loopback-only and must not be published by a container runtime.
  clusters:
    - name: dynamic_forward_proxy
      connect_timeout: 5s
      lb_policy: CLUSTER_PROVIDED
      cluster_type:
        name: envoy.clusters.dynamic_forward_proxy
        typed_config:
          "@type": type.googleapis.com/envoy.extensions.clusters.dynamic_forward_proxy.v3.ClusterConfig
          dns_cache_config:
            name: sandbox_egress_dns_cache
            dns_lookup_family: ALL
            dns_query_timeout: 2s
            dns_min_refresh_rate: 1s
            host_ttl: 60s
            max_hosts: 2048
            resolved_address_filter:
              ranges:
                - address_prefix: 0.0.0.0
                  prefix_len: 8
                - address_prefix: 10.0.0.0
                  prefix_len: 8
                - address_prefix: 100.64.0.0
                  prefix_len: 10
                - address_prefix: 127.0.0.0
                  prefix_len: 8
                - address_prefix: 169.254.0.0
                  prefix_len: 16
                - address_prefix: 172.16.0.0
                  prefix_len: 12
                - address_prefix: 192.0.0.0
                  prefix_len: 24
                - address_prefix: 192.0.2.0
                  prefix_len: 24
                - address_prefix: 192.88.99.0
                  prefix_len: 24
                - address_prefix: 192.168.0.0
                  prefix_len: 16
                - address_prefix: 198.18.0.0
                  prefix_len: 15
                - address_prefix: 198.51.100.0
                  prefix_len: 24
                - address_prefix: 203.0.113.0
                  prefix_len: 24
                - address_prefix: 224.0.0.0
                  prefix_len: 4
                - address_prefix: 240.0.0.0
                  prefix_len: 4
                - address_prefix: "::"
                  prefix_len: 96
                - address_prefix: "::1"
                  prefix_len: 128
                - address_prefix: "::ffff:0:0"
                  prefix_len: 96
                - address_prefix: "64:ff9b::"
                  prefix_len: 96
                - address_prefix: "64:ff9b:1::"
                  prefix_len: 48
                - address_prefix: "100::"
                  prefix_len: 64
                - address_prefix: "2001::"
                  prefix_len: 23
                - address_prefix: "2001:db8::"
                  prefix_len: 32
                - address_prefix: "2002::"
                  prefix_len: 16
                - address_prefix: "fc00::"
                  prefix_len: 7
                - address_prefix: "fe80::"
                  prefix_len: 10
                - address_prefix: "fec0::"
                  prefix_len: 10
                - address_prefix: "ff00::"
                  prefix_len: 8
      circuit_breakers:
        thresholds:
          - priority: DEFAULT
            max_connections: 256
            max_pending_requests: 256
            max_requests: 512
            max_retries: 0
admin:
  access_log_path: /dev/null
  address:
    socket_address:
      address: 127.0.0.1
      port_value: 9901
